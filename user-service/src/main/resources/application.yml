spring:
  application:
    name: user-service

  datasource:
    url: jdbc:mysql://localhost:3306/power_watch
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
    health:
      show-details: when_autorized
  metrics:
    tags:
      application: ${spring.application.name}