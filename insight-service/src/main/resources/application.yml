spring:
  application:
    name: insight-service

  ai:
    ollama:
      chat:
        options:
          model: deepseek-coder
      init:
        pull-model-strategy: never

usage:
  service:
    url: http://localhost:8083/api/v1/usage

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
    health:
      show-details: when_autorized
  metrics:
    tags:
      application: ${spring.application.name}